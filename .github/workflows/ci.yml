name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  web:
    name: 웹 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js 준비
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 잠금 파일 기준 의존성 설치
        run: npm ci --no-audit --no-fund

      - name: 개발 도구 테스트
        run: npm run check:tools

      - name: 웹 단위 테스트
        run: npm run test:web

      - name: 웹 린트와 타입 검사
        run: npm run check:web

      - name: 웹 프로덕션 빌드
        run: npm run build:web

  backend:
    name: 서버 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 25 준비
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 캐시 준비와 Wrapper 검증
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
          dependency-graph: disabled
          build-scan-publish: false

      - name: Testcontainers용 Docker 확인
        run: docker info --format '{{.ServerVersion}}'

      - name: 서버 단위·PostgreSQL 통합 테스트와 빌드
        run: ./backend/gradlew -p backend build --no-daemon

      - name: 서버 테스트 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/*.xml
          retention-days: 7
          if-no-files-found: warn
