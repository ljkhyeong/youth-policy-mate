plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.youthpolicymate'
version = '0.0.1-SNAPSHOT'
description = '청년정책메이트 백엔드'

springBoot {
    mainClass = 'kr.youthpolicymate.YouthPolicyMateApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.svix:svix:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.0'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'preview.contract.path', rootProject.file('../api/openapi.preview.json').absolutePath
    systemProperty 'policy.contract.path', rootProject.file('../api/openapi.policy.json').absolutePath
}

tasks.register('importPolicyCapture', JavaExec) {
    description = '확인한 온통청년 목록 캡처 최대 10건을 로컬 DB에 적재한다.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'kr.youthpolicymate.ingestion.PolicyCaptureImport'
    workingDir = rootProject.file('..')
}

tasks.register('collectPolicyPage', JavaExec) {
    description = '서울 필터의 한 페이지를 수집하거나 저장 원본 재처리·이력을 조회한다.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'kr.youthpolicymate.ingestion.OntongCollectionCommand'
    workingDir = rootProject.file('..')
}

tasks.register('exportPolicyOpenApi', Test) {
    description = '정책·회원·관리자 컨트롤러의 실제 OpenAPI 응답을 계약 파일로 생성한다.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'kr.youthpolicymate.policy.catalog.PolicyCatalogTest.matchesGeneratedContract' }
    systemProperty 'policy.contract.path', rootProject.file('../api/openapi.policy.json').absolutePath
    systemProperty 'policy.contract.update', 'true'
    outputs.upToDateWhen { false }
}

tasks.register('exportPreviewOpenApi', Test) {
    description = '개발 전용 컨트롤러의 실제 OpenAPI 응답을 계약 파일로 생성한다.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'kr.youthpolicymate.devpreview.PreviewApiContractTest.matchesGeneratedContract' }
    systemProperty 'preview.contract.path', rootProject.file('../api/openapi.preview.json').absolutePath
    systemProperty 'preview.contract.update', 'true'
    outputs.upToDateWhen { false }
}

tasks.register('managePolicyRules', JavaExec) {
    description = '공고 규칙 초안·적용 버전·재검토 상태를 관리한다.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'kr.youthpolicymate.policy.catalog.PolicyRuleCommand'
    workingDir = rootProject.file('..')
}

tasks.register('managePolicyAiRules', JavaExec) {
    description = '공고 개정에 연결한 AI 추출 요청과 규칙 초안 결과를 저장한다.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'kr.youthpolicymate.ingestion.PolicyAiRuleCommand'
    workingDir = rootProject.file('..')
}
