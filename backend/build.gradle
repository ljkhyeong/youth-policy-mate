plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.youthpolicymate'
version = '0.0.1-SNAPSHOT'
description = '청년정책메이트 백엔드'

springBoot {
    mainClass = 'kr.youthpolicymate.YouthPolicyMateApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.svix:svix:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.data:spring-data-commons'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.0'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'policy.contract.path', rootProject.file('../api/openapi.policy.json').absolutePath
    systemProperty 'email.rotation.classpath', sourceSets.main.runtimeClasspath.asPath
}

// 운영 명령은 루트 .env를 읽도록 저장소 루트에서 실행한다.
[
    collectPolicyPage: ['kr.youthpolicymate.ingestion.OntongCollectionCommand', '서울 필터의 한 페이지를 수집하거나 저장 원본 재처리·이력을 조회한다.'],
    managePolicyRules: ['kr.youthpolicymate.policy.catalog.PolicyRuleCommand', '공고 규칙 초안·적용 버전·재검토 상태를 관리한다.'],
    managePolicyAiRules: ['kr.youthpolicymate.ingestion.PolicyAiRuleCommand', '공고 개정에 연결한 AI 추출 요청과 규칙 초안 결과를 저장한다.'],
    rotateEmailKey: ['kr.youthpolicymate.member.EmailKeyRotationCommand', '이메일 주소 복호화를 점검하거나 서비스 중지 후 암호화 키를 교체한다.'],
    queryOpenAiCosts: ['kr.youthpolicymate.ingestion.OpenAiCostsCommand', '지정 프로젝트의 UTC 월 비용을 OpenAI에서 조회한다. 생성·DB 정산은 하지 않는다.'],
].each { taskName, command ->
    tasks.register(taskName, JavaExec) {
        description = command[1]
        group = 'application'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = command[0]
        workingDir = rootProject.file('..')
    }
}

// 실제 컨트롤러의 OpenAPI 응답으로 계약 파일을 갱신한다.
tasks.register('exportPolicyOpenApi', Test) {
    description = '정책·회원·관리자 컨트롤러의 실제 OpenAPI 응답을 계약 파일로 생성한다.'
    group = 'documentation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'kr.youthpolicymate.policy.catalog.PolicyCatalogTest.matchesGeneratedContract' }
    systemProperty 'policy.contract.path', rootProject.file('../api/openapi.policy.json').absolutePath
    systemProperty 'policy.contract.update', 'true'
    outputs.upToDateWhen { false }
}
