spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:${DB_PORT:55432}/${DB_NAME:youth_policy_mate}
    username: ${DB_USER:youth_policy_mate}
    password: ${DB_PASSWORD:local-only-password}

server:
  address: 127.0.0.1
  port: 8080

APP_COOKIE_SECURE: false

app:
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
