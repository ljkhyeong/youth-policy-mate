spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

APP_FRONTEND_URL: ${PUBLIC_APP_URL}
APP_BACKEND_URL: ${PUBLIC_APP_URL}
APP_COOKIE_SECURE: true
