spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db

app:
  url:
    frontend: ${PUBLIC_APP_URL}
    backend: ${PUBLIC_APP_URL}

# SecurityConfiguration의 로그인 성공·실패 리다이렉트가 아직 이 키를 직접 읽는다. app.url.frontend(AppUrls)로 옮기면 함께 지운다.
APP_FRONTEND_URL: ${PUBLIC_APP_URL}
