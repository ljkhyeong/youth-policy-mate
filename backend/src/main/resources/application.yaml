spring:
  application:
    name: youth-policy-mate
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
  task:
    scheduling:
      pool:
        # @Scheduled 작업(정책 수집·이메일 발송·마감 알림·AI 자동 처리)마다 스레드 하나를 둔다.
        # 한 작업의 외부 응답 대기(AI 최대 90초)가 다른 작업을 막지 않도록, 작업을 추가하면 함께 늘린다.
        size: 4

server:
  servlet:
    session:
      cookie:
        # 내장 서버(bootRun·bootJar, 테스트 RANDOM_PORT)로 실행할 때 Spring Session 세션 쿠키에 적용된다.
        # MockMvc MOCK 테스트에는 적용되지 않아 쿠키 이름이 기본값 SESSION이다.
        # HttpOnly·SameSite는 기본값과 같지만 보안 정책으로 명시한다.
        name: YPM_SESSION
        http-only: true
        same-site: lax
        secure: true

springdoc:
  api-docs:
    enabled: false

app:
  # 숫자·시각 형식이 틀리면 기동하지 않는다. 값이 없거나 범위를 벗어나면 AI 호출 직전에 보류한다.
  ai:
    enabled: ${AI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    monthly-limit-won: ${AI_MONTHLY_LIMIT_WON:}
    input-won-per-million: ${AI_INPUT_WON_PER_MILLION:}
    output-won-per-million: ${AI_OUTPUT_WON_PER_MILLION:}
    pricing-version: ${AI_PRICING_VERSION:}
    pricing-valid-until: ${AI_PRICING_VALID_UNTIL:}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:}
    auto:
      enabled: ${AI_AUTO_ENABLED:false}
      # 비우면 AiProperties.Auto의 기본값(0건으로 실행 차단·300초·3회)을 쓴다.
      daily-limit: ${AI_AUTO_DAILY_LIMIT:}
      interval-seconds: ${AI_AUTO_INTERVAL_SECONDS:}
      max-attempts: ${AI_AUTO_MAX_ATTEMPTS:}
  admin:
    member-ids: ${ADMIN_MEMBER_IDS:}
  url:
    frontend: ${APP_FRONTEND_URL:http://127.0.0.1:3000}
    backend: ${APP_BACKEND_URL:http://127.0.0.1:8080}
  email:
    enabled: ${EMAIL_ENABLED:false}
    encryption-key: ${EMAIL_ENCRYPTION_KEY:}
    from: ${EMAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
      read-api-key: ${RESEND_READ_API_KEY:}
      webhook-secret: ${RESEND_WEBHOOK_SECRET:}
  ontong:
    api-key: ${ONTONG_API_KEY:}
    daily-limit: ${ONTONG_COLLECTION_DAILY_LIMIT:0}
    interval: ${ONTONG_COLLECTION_INTERVAL_SECONDS:0}
    schedule:
      enabled: ${ONTONG_COLLECTION_SCHEDULE_ENABLED:false}
      first-page: ${ONTONG_COLLECTION_FIRST_PAGE:0}
      last-page: ${ONTONG_COLLECTION_LAST_PAGE:0}
      cycle: ${ONTONG_COLLECTION_CYCLE_SECONDS:0}
  reminders:
    enabled: ${REMINDERS_ENABLED:false}
    delivery-time: ${REMINDER_DELIVERY_TIME:09:00}
    poll: ${REMINDER_POLL_MS:60000}
