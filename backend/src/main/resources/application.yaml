spring:
  application:
    name: youth-policy-mate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false

app:
  ontong:
    schedule:
      enabled: ${ONTONG_COLLECTION_SCHEDULE_ENABLED:false}
  reminders:
    enabled: ${REMINDERS_ENABLED:false}
