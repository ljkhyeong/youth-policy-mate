spring:
  application:
    name: youth-policy-mate
  mail:
    host: ${app.email.host:${EMAIL_SMTP_HOST:}}
    port: ${app.email.port:${EMAIL_SMTP_PORT:587}}
    username: ${app.email.username:${EMAIL_SMTP_USERNAME:}}
    password: ${app.email.password:${EMAIL_SMTP_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  flyway:
    clean-disabled: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false

app:
  ai:
    auto:
      enabled: ${AI_AUTO_ENABLED:false}
  admin:
    member-ids: ${ADMIN_MEMBER_IDS:}
  email:
    enabled: ${EMAIL_ENABLED:false}
    encryption-key: ${EMAIL_ENCRYPTION_KEY:}
    from: ${EMAIL_FROM:}
    provider: ${EMAIL_PROVIDER:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}
      webhook-secret: ${RESEND_WEBHOOK_SECRET:}
  ontong:
    schedule:
      enabled: ${ONTONG_COLLECTION_SCHEDULE_ENABLED:false}
  reminders:
    enabled: ${REMINDERS_ENABLED:false}
