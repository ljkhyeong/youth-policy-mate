spring:
  application:
    name: youth-policy-mate
  mail:
    host: ${app.email.host:${EMAIL_SMTP_HOST:}}
    port: ${app.email.port:${EMAIL_SMTP_PORT:587}}
    username: ${app.email.username:${EMAIL_SMTP_USERNAME:}}
    password: ${app.email.password:${EMAIL_SMTP_PASSWORD:}}
    default-encoding: UTF-8
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
  task:
    scheduling:
      pool:
        # @Scheduled 작업(정책 수집·이메일 발송·마감 알림·AI 자동 처리)마다 스레드 하나를 둔다.
        # 한 작업의 외부 응답 대기(AI 최대 90초)가 다른 작업을 막지 않도록, 작업을 추가하면 함께 늘린다.
        size: 4

management:
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false

app:
  ai:
    auto:
      enabled: ${AI_AUTO_ENABLED:false}
  admin:
    member-ids: ${ADMIN_MEMBER_IDS:}
  email:
    enabled: ${EMAIL_ENABLED:false}
    encryption-key: ${EMAIL_ENCRYPTION_KEY:}
    from: ${EMAIL_FROM:}
    provider: ${EMAIL_PROVIDER:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}
      read-api-key: ${RESEND_READ_API_KEY:}
      webhook-secret: ${RESEND_WEBHOOK_SECRET:}
  ontong:
    schedule:
      enabled: ${ONTONG_COLLECTION_SCHEDULE_ENABLED:false}
  reminders:
    enabled: ${REMINDERS_ENABLED:false}
    delivery-time: ${REMINDER_DELIVERY_TIME:09:00}
    poll: ${REMINDER_POLL_MS:60000}
