name: youth-policy-mate

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-youth_policy_mate}
      POSTGRES_USER: ${DB_USER:-youth_policy_mate}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only-password}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
